name: "Test Build (unsigned)"

# Push-triggered so it runs on the fork without the workflow_dispatch
# default-branch registration gate. Produces unsigned artifacts for local testing.
on:
  push:
    branches:
      - feat/openai-endpoint
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  testbuild-macos:
    name: Test Build macOS (Apple Silicon, unsigned)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: macos-latest-aarch64-apple-darwin

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Build llama-helper sidecar
        run: |
          cargo build --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
          ls -la frontend/src-tauri/binaries/

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          # tauri.testbuild.conf.json disables createUpdaterArtifacts so no
          # signing key is required. macOS signingIdentity is ad-hoc ("-").
          args: --target aarch64-apple-darwin --config src-tauri/tauri.testbuild.conf.json

      - name: List build artifacts
        run: find target/aarch64-apple-darwin/release/bundle -type f 2>/dev/null || true

      - name: Upload .dmg + .app
        uses: actions/upload-artifact@v4
        with:
          name: meetily-macos-aarch64-testbuild-${{ steps.get-version.outputs.version }}
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14

  testbuild-windows:
    name: Test Build Windows (x64, unsigned, no-admin NSIS)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-latest-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Build llama-helper sidecar (CPU)
        shell: bash
        run: |
          cargo build --release -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper.exe frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe
          ls -la frontend/src-tauri/binaries/

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Stage WebView2 fixed runtime (from runner's installed Edge WebView2)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bases = @(
            "C:\Program Files (x86)\Microsoft\EdgeWebView\Application",
            "$env:ProgramFiles\Microsoft\EdgeWebView\Application"
          )
          $base = $bases | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $base) { throw "WebView2 runtime not found on runner" }
          $ver = Get-ChildItem $base -Directory | Where-Object { $_.Name -match '^\d' } | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Using WebView2 runtime: $($ver.FullName)"
          $dst = "frontend/src-tauri/WebView2Runtime"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $ver.FullName '*') -Destination $dst -Recurse -Force
          if (!(Test-Path "$dst\msedgewebview2.exe")) { throw "msedgewebview2.exe missing in staged runtime" }
          Write-Host "Staged WebView2 fixed runtime OK"

      - name: Build Tauri app (unsigned, fixedRuntime, CPU)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          # tauri.windows-portable.conf.json: NSIS per-user (no admin), WebView2
          # fixedRuntime (embedded, zero-install, works offline / without preinstalled
          # WebView2), signing + updater artifacts disabled. CPU build (no Vulkan).
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows-portable.conf.json

      - name: List build artifacts
        shell: bash
        run: find target/x86_64-pc-windows-msvc/release/bundle -type f 2>/dev/null || true

      - name: Assemble zero-install portable (.zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Write-Host "Installer: $($setup.FullName)"
          # Silent per-user install (no admin, no prompts) → produces the exact app tree
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          Write-Host "Installer exit code: $($p.ExitCode)"
          # Locate the installed app tree under LOCALAPPDATA
          $installed = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter meetily.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Could not locate installed meetily.exe under LOCALAPPDATA" }
          $appDir = $installed.Directory.FullName
          Write-Host "Installed app dir: $appDir"
          Get-ChildItem $appDir | Format-Table Name,Length
          # Drop the uninstaller (irrelevant for a portable copy)
          Remove-Item (Join-Path $appDir 'uninstall.exe') -ErrorAction SilentlyContinue
          # Sanity: the fixed WebView2 runtime must be embedded in the portable tree
          $hasWv = Get-ChildItem -Path $appDir -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hasWv) { Write-Warning "msedgewebview2.exe NOT found in portable tree — WebView2 may not be embedded" } else { Write-Host "WebView2 runtime embedded at: $($hasWv.FullName)" }
          $ver = "${{ steps.get-version.outputs.version }}"
          $zip = "meetily-$ver-windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $appDir '*') -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name,Length

      - name: Upload portable .zip + NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: meetily-windows-x64-portable-${{ steps.get-version.outputs.version }}
          path: |
            meetily-*-windows-x64-portable.zip
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
